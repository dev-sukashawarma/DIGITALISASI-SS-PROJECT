name: Build & Deploy SUKASHAWARMA (GHCR to Coolify)

on:
  push:
    branches: [main]
    paths:
      - 'SUKASHAWARMA/**'
      - '.github/workflows/deploy-sukashawarma-coolify.yml'
  workflow_dispatch:

concurrency:
  group: deploy-sukashawarma-production
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build Docker Image & Push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dev-sukashawarma/digitalisasi-ss-project/sukashawarma
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: SUKASHAWARMA/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify Deploy (Pull & Restart on VPS)
        continue-on-error: true
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -n "$COOLIFY_TOKEN" ]; then
            echo "Triggering Coolify deployment via API..."
            curl --fail --show-error --silent --location \
              --request POST "https://coolify.sukashawarma.tech/api/v1/deploy?uuid=jz9pnxnvxf9q7yck6fk2trt0" \
              --header "Authorization: Bearer $COOLIFY_TOKEN"
            echo -e "\nCoolify deployment successfully triggered!"
          else
            echo "COOLIFY_API_TOKEN is not set, skipping Coolify trigger."
          fi

      - name: Verify Live Service Health (Smoke Test)
        run: |
          echo "Waiting 15s for Coolify container restart..."
          sleep 15
          APP_URL="https://sukashawarma.com"
          echo "Probing $APP_URL..."
          for i in {1..8}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$APP_URL" || true)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "✅ SUKASHAWARMA Website is LIVE and healthy (HTTP $STATUS)!"
              exit 0
            fi
            sleep 5
          done
          echo "⚠️ Service did not return healthy HTTP status within timeout."
          exit 1
