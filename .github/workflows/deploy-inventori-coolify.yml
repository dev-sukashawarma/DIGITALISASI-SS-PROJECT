name: Build & Deploy Inventori (GHCR to Coolify)

on:
  push:
    branches: [main]
    paths:
      - 'apps/inventori/**'
      - 'packages/auth/**'
      - 'packages/design-system/**'
      - 'packages/realtime/**'
      - 'packages/offline-queue/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/deploy-inventori-coolify.yml'
  workflow_dispatch:

concurrency:
  group: deploy-inventori-production
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build Docker Image & Push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dev-sukashawarma/digitalisasi-ss-project/inventori
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/inventori/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_COOKIE_DOMAIN=${{ secrets.NEXT_PUBLIC_COOKIE_DOMAIN || '.sukashawarma.com' }}
            NEXT_PUBLIC_PORTAL_URL=${{ secrets.NEXT_PUBLIC_PORTAL_URL || 'https://app.sukashawarma.com' }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://auth.sukashawarma.com' }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Trigger Coolify Webhook (Pull & Restart on VPS)
        continue-on-error: true
        env:
          DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_INVENTORI_DEPLOY_WEBHOOK }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK" ]; then
            echo "Triggering Coolify webhook..."
            curl --fail --show-error --silent --location --request POST "$DEPLOY_WEBHOOK" || echo "Webhook notice: call completed"
            echo "Coolify webhook triggered!"
          else
            echo "COOLIFY_INVENTORI_DEPLOY_WEBHOOK is not set, skipping webhook trigger."
          fi
