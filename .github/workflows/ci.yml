name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  admin-dashboard:
    name: admin-dashboard — type-check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build internal packages
        run: |
          yarn workspace @suka/auth build
          yarn workspace @suka/design-system build
      - name: Type-check
        run: yarn workspace @suka/admin-dashboard type-check
      - name: Test
        run: yarn workspace @suka/admin-dashboard test

  migration-timestamp-lint:
    name: Migration timestamps sane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Determine newly added migration files
        # Data flows to later steps via /tmp/added.txt on the shared runner
        # filesystem, not via step outputs — no `id:` needed here.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ -z "$BASE" ]; then
              BASE="HEAD~1"
            fi
          fi
          if ! git diff --diff-filter=AR --name-only "$BASE" "${{ github.sha }}" -- 'supabase/migrations/*.sql' > /tmp/added.txt; then
            echo "::error::git diff gagal (base=$BASE) — tidak bisa menentukan file migration baru. Cek fetch-depth/base SHA, JANGAN anggap 'tidak ada migration baru'." >&2
            exit 1
          fi
          cat /tmp/added.txt
      - name: Run unit tests
        run: node --test scripts/migration-timestamp-lint.test.mjs
      - name: Lint new migration timestamps
        run: |
          if [ -s /tmp/added.txt ]; then
            mapfile -t files < /tmp/added.txt
            node scripts/migration-timestamp-lint.mjs "${files[@]}"
          else
            echo "Tidak ada migration baru, skip."
          fi
