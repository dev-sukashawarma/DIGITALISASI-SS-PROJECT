name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  admin-dashboard:
    name: admin-dashboard — type-check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build internal packages
        run: |
          yarn workspace @suka/auth build
          yarn workspace @suka/design-system build
      - name: Type-check
        run: yarn workspace @suka/admin-dashboard type-check
      - name: Test
        run: yarn workspace @suka/admin-dashboard test
