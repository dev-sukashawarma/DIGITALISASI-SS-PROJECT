      <script>
          async function process() {
              try {
                  const HumanClass = window.Human.Human || window.Human.default;
                  const humanInstance = new HumanClass({
                      modelBasePath: 'https://cdn.jsdelivr.net/npm/@vladmandic/human/models',
                      backend: 'wasm',
                      face: { enabled: true, detector: { return: true, rotation: true }, mesh: { enabled: true }, iris: { enabled: true }, description: { enabled: true } }
                  });
                  await humanInstance.load();
                  console.log("Human loaded.");
                  
                  const img = document.getElementById('img');
                  
                  async function doDetect() {
                      try {
                          const result = await humanInstance.detect(img);
                          if (result.face && result.face.length > 0) {
                              console.log("Face detected!");
                              window.resultDescriptor = result.face[0].embedding;
                          } else {
                              console.log("No face detected by humanInstance.detect");
                              window.resultDescriptor = [];
                          }
                      } catch (e) {
                          console.error("Detect error:", e.message);
                      }
                      window.detectionDone = true;
                  }
                  
                  if(img.complete) {
                      await doDetect();
                  } else {
                      img.onload = doDetect;
                  }
              } catch (e) {
                  console.error("Error in process:", e.message);
                  window.detectionDone = true;
              }
          }
          process();
      </script>
