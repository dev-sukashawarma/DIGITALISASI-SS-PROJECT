name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  admin-dashboard:
    name: admin-dashboard — type-check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines
      - name: Build internal packages
        run: |
          yarn workspace @suka/auth build
          yarn workspace @suka/design-system build
      - name: Type-check Admin Dashboard
        run: yarn workspace @suka/admin-dashboard type-check
      - name: Run Core Apps Automated Unit Tests
        run: |
          yarn workspace @suka/admin-dashboard test
          yarn workspace @suka/stok test
          yarn workspace @suka/distribusi test
          yarn workspace @suka/finance test
          yarn workspace @suka/absensi test
          yarn workspace @suka/inventori test
          yarn workspace @suka/bot type-check
          yarn workspace @suka/bot test

  migration-timestamp-lint:
    name: Migration timestamps sane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Determine newly added migration files
        # Data flows to later steps via /tmp/added.txt on the shared runner
        # filesystem, not via step outputs — no `id:` needed here.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ -z "$BASE" ]; then
              BASE="HEAD~1"
            fi
          fi
          if ! git diff --diff-filter=AR --name-only "$BASE" "${{ github.sha }}" -- 'supabase/migrations/*.sql' > /tmp/added.txt; then
            echo "::error::git diff gagal (base=$BASE) — tidak bisa menentukan file migration baru. Cek fetch-depth/base SHA, JANGAN anggap 'tidak ada migration baru'." >&2
            exit 1
          fi
          cat /tmp/added.txt
      - name: Run unit tests
        run: node --test scripts/migration-timestamp-lint.test.mjs
      - name: Lint new migration timestamps
        run: |
          if [ -s /tmp/added.txt ]; then
            mapfile -t files < /tmp/added.txt
            node scripts/migration-timestamp-lint.mjs "${files[@]}"
          else
            echo "Tidak ada migration baru, skip."
          fi

  paritas-aplikasi-pelanggan:
    name: Aplikasi pelanggan Android & iOS berubah bersama
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run unit tests
        run: node --test scripts/paritas-aplikasi-pelanggan.test.mjs
      - name: Kumpulkan berkas berubah & pesan
        # Judul/isi PR lewat env, bukan diinterpolasi ke skrip (hindari injeksi).
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ -z "$BASE" ]; then
              BASE="HEAD~1"
            fi
          fi
          if ! git diff --name-only "$BASE" "${{ github.sha }}" > /tmp/berkas.txt; then
            echo "::error::git diff gagal (base=$BASE) — tidak bisa memeriksa paritas." >&2
            exit 1
          fi
          { printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY"; git log --format='%B' "$BASE..${{ github.sha }}"; } > /tmp/pesan.txt
      - name: Periksa paritas
        run: node scripts/paritas-aplikasi-pelanggan.mjs /tmp/berkas.txt /tmp/pesan.txt
